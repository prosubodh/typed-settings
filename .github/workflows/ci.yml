name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        node: ['20', '22']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The init-template integration tests load the built package
      # (typed-settings self-resolves to dist/), so build before testing.
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run size
