name: publish

# Publishes to JSR when a GitHub Release is cut.
# One-time setup (on jsr.io, as the @typed-settings scope owner):
#   1. Create the @typed-settings scope if it doesn't exist.
#   2. Link the package to this repo (package Settings > GitHub) so trusted
#      publishing via OIDC works — no tokens needed.
# After that: bump "version" in jsr.json + package.json, push, cut a Release,
# and this workflow publishes that exact tag.

on:
  release:
    types: [published]
  # Retry path: `gh workflow run publish.yml --ref v0.1.4` re-fires the exact tag
  # without deleting and recreating the release (useful when GitHub Actions is
  # degraded and the release-triggered run sits queued).
  workflow_dispatch:

jobs:
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # JSR resolves npm deps (yaml, smol-toml) from node_modules — it must exist.
      - run: npm ci
      - run: npx jsr publish

  # npm publishing is parked while GitHub Actions is degraded: the runner queue
  # stalled every release-triggered run, and 0.1.4 needs to reach JSR.
  # To restore it: uncomment this block and drop this note. The token is already
  # in repo settings as NPM_TOKEN. Re-runs are safe: both registries reject a
  # version that already exists rather than overwriting it.
  #
  # publish-npm:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     id-token: write # provenance attestation
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         ref: ${{ github.event.release.tag_name || github.ref }}
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         registry-url: 'https://registry.npmjs.org'
  #     - run: npm ci
  #     - run: npm run build
  #     # npm latest jumps from 0.1.1 straight to this version.
  #     - run: npm publish --provenance --access public
  #       env:
  #         NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
