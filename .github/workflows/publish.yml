name: publish

# Publishes to JSR when a GitHub Release is cut.
# One-time setup (on jsr.io, as the @typed-settings scope owner):
#   1. Create the @typed-settings scope if it doesn't exist.
#   2. Link the package to this repo (package Settings > GitHub) so trusted
#      publishing via OIDC works — no tokens needed.
# After that: bump "version" in jsr.json + package.json, push, cut a Release,
# and this workflow publishes that exact tag.

on:
  release:
    types: [published]

jobs:
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # JSR resolves npm deps (yaml, smol-toml) from node_modules — it must exist.
      - run: npm ci
      - run: npx jsr publish

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      # npm latest will jump from 0.1.1 to this version (0.1.2/0.1.3 were JSR-only, docs/code).
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
